# Postgres settings for a 1 vCPU / 1 GB box shared with the Node app.
# Memory budget (approx.): shared_buffers 256 MB + ~20 backends + Node ~100-150 MB,
# leaving the rest of the 1 GB cgroup for the OS page cache.
listen_addresses = '*'
max_connections = 20                 # app pool 10 + seed/admin/sampler headroom
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
random_page_cost = 1.1               # SSD
max_wal_size = 1GB
dynamic_shared_memory_type = posix

# Durability left at defaults (fsync on, synchronous_commit on, full_page_writes on).

# Observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.track_utility = on   # so BEGIN/COMMIT (WAL flush) time is visible
track_io_timing = on
track_wal_io_timing = on              # WAL write/fsync time in pg_stat_wal
log_checkpoints = on
log_lock_waits = on                  # logs any lock wait longer than deadlock_timeout (1 s)
log_timezone = 'UTC'
timezone = 'UTC'
